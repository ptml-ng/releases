name: Send app to testers

on:
  workflow_call:
    inputs:
      server-flavour:
        description: "Server Flavour"
        required: true
        type: string
        default: "prod"

      company-name:
        description: "Company Name"
        required: false
        type: string

      package-name:
        description: "Package Name"
        required: false
        type: string

      upload-to-firebase:
        description: "Upload to Firebase"
        required: true
        type: boolean
        default: true

      prefix:
        description: "Artifact Prefix"
        required: true
        type: string
        default: ""

      upload-to-github:
        description: "Upload to GitHub Releases"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repos
        uses: ptml-ng/releases/.github/actions/checkout-repos@main
        with:
          checkout-app: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Get build values
        id: build-values
        working-directory: app
        run: |
          python3 -u ../releases/scripts/build_values.py "${{ inputs.server-flavour }}" "${{ inputs.company-name }}" "${{ inputs.package-name }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs read the most recent default-branch cache but don't push their own — keeps one
          # warm cache shared across PRs instead of a cold cache per branch.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build app
        working-directory: app
        run: |
          ./gradlew ${{ steps.build-values.outputs.BUILD_COMMAND }} \
            --build-cache --configuration-cache

      - name: Distribute APK splits to Firebase App Distribution
        if: ${{ inputs.upload-to-firebase == true }}
        uses: logickoder/firebase-distribution@v1
        with:
          workingDirectory: app
          serviceCredentialsFileContent: ${{ secrets.GCP_CREDENTIAL }}
          file: "${{ steps.build-values.outputs.PATH }}/*.apk"
          appId: ${{ steps.build-values.outputs.APP_ID }}
          groups: QA
          debug: "true"

      - name: Rename artifacts
        env:
          BUILD_PATH: ${{ steps.build-values.outputs.PATH }}
          ARTIFACT_PREFIX: ${{ inputs.prefix }}
        run: python3 -u releases/scripts/rename_artifacts.py "app/$BUILD_PATH" "$ARTIFACT_PREFIX"

      - name: Upload app to Google Drive
        uses: ptml-ng/releases/.github/actions/upload-to-drive@main
        with:
          filename: "app/${{ steps.build-values.outputs.PATH }}/*.apk"
          mime-type: "application/vnd.android.package-archive"
          client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          refresh-token: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          folder-id: ${{ secrets.DRIVE_FOLDER_ID }}

      - name: Uploading Release
        if: ${{ inputs.upload-to-github == true }}
        uses: ptml-ng/releases/.github/actions/upload-github-release@main
        with:
          file-glob: "app/${{ steps.build-values.outputs.PATH }}/*.apk"
          tag: ${{ inputs.package-name || inputs.prefix }}
          repo-token: ${{ secrets.REPO_TOKEN }}
