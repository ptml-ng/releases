name: Promote KMP Android build to production link

# Modern promotion workflow. Pairs with build-app.yml: downloads `temp-<prefix>-<company>-<server>-…`
# APKs from Drive, strips the `temp-` portion via rename_artifacts.py, re-uploads. Legacy callers
# (driver-app, management-app) stick with deploy.yml until they modernize.

on:
  workflow_call:
    inputs:
      server-flavour:
        description: "Server flavour"
        required: true
        type: string
        default: "prod"
      company-name:
        description: "Company id"
        required: false
        type: string
      prefix:
        description: "Production prefix (sans the `temp-` portion)"
        required: true
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repos
        uses: ptml-ng/releases/.github/actions/checkout-repos@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute artifact name
        id: artifact-name
        uses: ptml-ng/releases/.github/actions/compute-artifact-name@main
        with:
          prefix: ${{ inputs.prefix }}
          company-name: ${{ inputs.company-name }}
          server-flavour: ${{ inputs.server-flavour }}

      - name: Download apps from Google Drive
        uses: logickoder/google-drive-download@main
        with:
          authType: "oauth"
          clientId: ${{ secrets.OAUTH_CLIENT_ID }}
          clientSecret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          refreshToken: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          filename: "temp-${{ steps.artifact-name.outputs.value }}-*.apk"
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
          destination: "./downloads/"

      - name: Rename artifacts (strip `temp-` portion)
        env:
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.value }}
        run: |
          python3 -u releases/scripts/rename_artifacts.py \
            "./downloads/" \
            "$ARTIFACT_NAME" \
            "temp-$ARTIFACT_NAME"

      - name: Upload apps to Google Drive
        uses: ptml-ng/releases/.github/actions/upload-to-drive@main
        with:
          filename: "./downloads/*.apk"
          mime-type: "application/vnd.android.package-archive"
          client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          refresh-token: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          folder-id: ${{ secrets.DRIVE_FOLDER_ID }}
