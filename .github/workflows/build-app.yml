name: Build KMP Android app

# Modern reusable workflow for the flavorless KMP shape (:apps:android, -Pcompany/-Pserver).
# Driven by scripts/build_app_values.py. Always renames artifacts as
# `<prefix>-<company>-<server>-<file>` so different company×server builds don't overwrite each
# other in the shared Drive folder. Legacy callers (driver-app, management-app) keep using
# build.yml/build_values.py until they modernize.

on:
  workflow_call:
    inputs:
      server-flavour:
        description: "Server (-Pserver=…)"
        required: true
        type: string
        default: "prod"
      company-name:
        description: "Company id (matches config.jsonc)"
        required: false
        type: string
      package-name:
        description: "Override package name (optional)"
        required: false
        type: string
      upload-to-firebase:
        description: "Upload APK splits to Firebase App Distribution"
        required: true
        type: boolean
        default: true
      prefix:
        description: "Artifact prefix — company + server are appended automatically"
        required: true
        type: string
        default: ""
      include-version:
        description: "Suffix the APK filenames with -v<version>"
        required: false
        type: boolean
        default: false
      upload-to-github:
        description: "Upload to GitHub Releases"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repos
        uses: ./.github/actions/checkout-repos
        with:
          checkout-app: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Get build values
        id: build-values
        working-directory: app
        run: |
          python3 -u ../releases/scripts/build_app_values.py \
            "${{ inputs.server-flavour }}" \
            "${{ inputs.company-name }}" \
            "${{ inputs.package-name }}" \
            --target android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs read the most recent default-branch cache but don't push their own — keeps one
          # warm cache shared across PRs instead of a cold cache per branch.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Cache ~/.konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build app
        working-directory: app
        run: |
          ./gradlew ${{ steps.build-values.outputs.BUILD_COMMAND }} \
            -PincludeVersion=${{ inputs.include-version }} \
            --build-cache --configuration-cache

      - name: Distribute APK splits to Firebase App Distribution
        if: ${{ inputs.upload-to-firebase == true }}
        uses: logickoder/firebase-distribution@v1
        with:
          workingDirectory: app
          serviceCredentialsFileContent: ${{ secrets.GCP_CREDENTIAL }}
          file: "${{ steps.build-values.outputs.PATH }}/*.apk"
          appId: ${{ steps.build-values.outputs.APP_ID }}
          groups: QA
          debug: "true"

      - name: Compute artifact name
        id: artifact-name
        uses: ./.github/actions/compute-artifact-name
        with:
          prefix: ${{ inputs.prefix }}
          company-name: ${{ inputs.company-name }}
          server-flavour: ${{ inputs.server-flavour }}

      - name: Rename artifacts
        env:
          BUILD_PATH: ${{ steps.build-values.outputs.PATH }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.value }}
        run: python3 -u releases/scripts/rename_artifacts.py "app/$BUILD_PATH" "$ARTIFACT_NAME"

      - name: Upload app to Google Drive
        uses: ./.github/actions/upload-to-drive
        with:
          filename: "app/${{ steps.build-values.outputs.PATH }}/*.apk"
          mime-type: "application/vnd.android.package-archive"
          client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          refresh-token: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          folder-id: ${{ secrets.DRIVE_FOLDER_ID }}

      - name: Uploading Release
        if: ${{ inputs.upload-to-github == true }}
        uses: ./.github/actions/upload-github-release
        with:
          file-glob: "app/${{ steps.build-values.outputs.PATH }}/*.apk"
          tag: ${{ inputs.package-name || inputs.prefix }}
          repo-token: ${{ secrets.REPO_TOKEN }}
