name: Build KMP desktop installer (Windows)

# Reusable workflow for Compose-Desktop Windows installers. Windows-only for now (MSI); macOS (.dmg)
# / Linux (.deb) can be added later by promoting `runs-on` to a matrix. Driven by
# scripts/build_app_values.py with `--target desktop` — same script as the Android build.

on:
  workflow_call:
    inputs:
      server-flavour:
        description: "Server (-Pserver=…)"
        required: true
        type: string
        default: "prod"
      company-name:
        description: "Company id (matches config.jsonc)"
        required: false
        type: string
      package-name:
        description: "Override package name (optional)"
        required: false
        type: string
      prefix:
        description: "Artifact prefix — company + server are appended automatically"
        required: true
        type: string
        default: ""
      include-version:
        description: "Suffix the installer filename with -v<version>"
        required: false
        type: boolean
        default: false
      upload-to-github:
        description: "Upload to GitHub Releases"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repos
        uses: ptml-ng/releases/.github/actions/checkout-repos@main
        with:
          checkout-app: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get build values
        id: build-values
        working-directory: app
        shell: bash
        run: |
          python3 -u ../releases/scripts/build_app_values.py \
            "${{ inputs.server-flavour }}" \
            "${{ inputs.company-name }}" \
            "${{ inputs.package-name }}" \
            --target desktop

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Cache ~/.konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build desktop installer
        working-directory: app
        shell: bash
        run: |
          ./gradlew ${{ steps.build-values.outputs.BUILD_COMMAND }} \
            -PincludeVersion=${{ inputs.include-version }} \
            --build-cache --configuration-cache

      - name: Compute artifact name
        id: artifact-name
        uses: ptml-ng/releases/.github/actions/compute-artifact-name@main
        with:
          prefix: ${{ inputs.prefix }}
          company-name: ${{ inputs.company-name }}
          server-flavour: ${{ inputs.server-flavour }}

      - name: Rename installer
        shell: bash
        env:
          BUILD_PATH: ${{ steps.build-values.outputs.PATH }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.value }}
        run: python3 -u releases/scripts/rename_artifacts.py "app/$BUILD_PATH" "$ARTIFACT_NAME" --ext msi

      - name: Upload installer to Google Drive
        uses: ptml-ng/releases/.github/actions/upload-to-drive@main
        with:
          filename: "app/${{ steps.build-values.outputs.PATH }}/*.msi"
          mime-type: "application/x-msi"
          client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          refresh-token: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          folder-id: ${{ secrets.DRIVE_FOLDER_ID }}

      - name: Uploading Release
        if: ${{ inputs.upload-to-github == true }}
        uses: ptml-ng/releases/.github/actions/upload-github-release@main
        with:
          file-glob: "app/${{ steps.build-values.outputs.PATH }}/*.msi"
          tag: ${{ inputs.package-name || inputs.prefix }}
          repo-token: ${{ secrets.REPO_TOKEN }}
