name: Build KMP desktop installer (Windows)

# Reusable workflow for Compose-Desktop Windows installers. Windows-only for now (MSI); macOS (.dmg)
# / Linux (.deb) can be added later by promoting `runs-on` to a matrix. Driven by
# scripts/build_app_values.py with `--target desktop` — same script as the Android build.

on:
  workflow_call:
    inputs:
      server-flavour:
        description: "Server (-Pserver=…)"
        required: true
        type: string
        default: "prod"
      company-name:
        description: "Company id (matches config.json)"
        required: false
        type: string
      package-name:
        description: "Override package name (optional)"
        required: false
        type: string
      prefix:
        description: "Artifact prefix — company + server are appended automatically"
        required: true
        type: string
        default: ""
      upload-to-github:
        description: "Upload to GitHub Releases"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6
        with:
          path: app

      - name: Checkout releases repository
        uses: actions/checkout@v6
        with:
          repository: ptml-ng/releases
          path: releases
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get build values
        id: build-values
        working-directory: app
        shell: bash
        run: |
          python3 -u ../releases/scripts/build_app_values.py \
            "${{ inputs.server-flavour }}" \
            "${{ inputs.company-name }}" \
            "${{ inputs.package-name }}" \
            --target desktop

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Cache ~/.konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build desktop installer
        working-directory: app
        shell: bash
        run: |
          ./gradlew ${{ steps.build-values.outputs.BUILD_COMMAND }} \
            --build-cache --configuration-cache

      - name: Rename installer
        shell: bash
        run: |
          python3 -u releases/scripts/rename_artifacts.py \
            "app/${{ steps.build-values.outputs.PATH }}" \
            "${{ inputs.prefix }}-${{ inputs.company-name }}-${{ inputs.server-flavour }}" \
            --ext msi

      - name: Upload installer to Google Drive
        uses: logickoder/g-drive-upload@main
        with:
          authType: "oauth"
          clientId: ${{ secrets.OAUTH_CLIENT_ID }}
          clientSecret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          refreshToken: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          filename: "app/${{ steps.build-values.outputs.PATH }}/*.msi"
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
          overwrite: "true"
          mimeType: "application/x-msi"

      - name: Uploading Release
        if: ${{ inputs.upload-to-github == true }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.REPO_TOKEN }}
          file_glob: true
          file: "app/${{ steps.build-values.outputs.PATH }}/*.msi"
          tag: ${{ inputs.package-name || inputs.prefix }}
          repo_name: ptml-ng/releases
          overwrite: true
